server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Vite fingerprints these files; a release always gets new URLs.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Missing static files must not return the SPA's HTML entry point.
    location ~* \.(?:png|webp|avif|jpe?g|svg|woff2?|json|md|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Public static HTML: browsers revalidate; the CDN can serve it for five minutes.
        add_header Cache-Control "public, max-age=0, s-maxage=300";
    }
}
