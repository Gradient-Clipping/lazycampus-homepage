name: Verify and publish homepage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: lazycampus/lazycampus-homepage

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify physics and interaction state
        run: npm test

      - name: Build production image
        run: docker build --tag lazycampus-homepage:verify .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the production container
        env:
          VERIFY_URL: http://127.0.0.1:8080
        run: |
          docker run --detach --name homepage-verify \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 64m --cpus 0.1 \
            --publish 127.0.0.1:8080:8080 lazycampus-homepage:verify
          trap 'docker logs homepage-verify; docker rm --force homepage-verify' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors "$VERIFY_URL/healthz"
          node scripts/verify-http.mjs
          npm run verify

      - name: Save browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-verification
          path: renders/v8.1/verification/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and publish immutable release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
